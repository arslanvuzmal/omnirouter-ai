name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref rather than queueing them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: omnirouter
          POSTGRES_PASSWORD: omnirouter_ci
          POSTGRES_DB: omnirouter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U omnirouter -d omnirouter_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://omnirouter:omnirouter_ci@localhost:5432/omnirouter_test?schema=public
      DIRECT_URL: postgresql://omnirouter:omnirouter_ci@localhost:5432/omnirouter_test?schema=public
      # CI-only values. These are not secrets: they guard a database that is
      # created and destroyed within this job and holds no real data.
      AUTH_SECRET: ci-auth-secret-value-at-least-32-characters-long
      ENCRYPTION_KEY: Y2ktZW5jcnlwdGlvbi1rZXktZXhhY3RseS0zMmJ5dGU=
      INTERNAL_API_SECRET: ci-internal-secret-value
      APP_URL: http://localhost:3000
      DEMO_MODE: 'true'
      NEXT_PUBLIC_DEMO_MODE: 'true'
      DEMO_PASSWORD: CiDemoPassword123

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Integration tests
        run: npm run test:integration

      - name: Security tests
        run: npm run test:security

      - name: Seed demonstration data
        run: npx tsx prisma/seed/index.ts

      - name: Verify demonstration data
        run: npm run demo:verify

      - name: Production build
        run: npm run build
